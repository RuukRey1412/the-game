<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>学長ゼミバトル - Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>学長ゼミバトル</h2>
            <input type="text" id="room-input" placeholder="合言葉を入力">
            <button onclick="joinRoom()">入室する</button>
            <p id="wait-msg" style="display:none;">対戦相手を待っています...</p>
        </div>
    </div>

    <div id="overlay">
        <h1 id="winner-msg">WINNER!</h1>
        <button onclick="location.reload()">もう一度遊ぶ</button>
    </div>

    <div id="main-layout" style="display:none;">
        <div id="battle-sector">
            <div id="role-indicator"><span id="my-role-label">接続中...</span></div>
            
            <div id="enemy-view"></div> <div id="action-center">
                <button id="skip-btn" onclick="takeAction()" style="display:none;">終了</button>
            </div>

            <div id="my-view"></div> </div>

        <aside id="info-panel">
            <div class="panel-section info-box">
                <h2>CARD INFO</h2>
                <div id="card-detail">
                    <p class="placeholder">カードをタップして詳細を表示</p>
                </div>
                <button id="use-confirm-btn" style="display:none;">使用する</button>
            </div>
            
            <div class="panel-section log-section">
                <h2>LOG</h2>
                <div id="log-container"><div id="log"></div></div>
            </div>

            <div id="draw-btn-container">
                <div id="draw-zone" class="draw-zone" onclick="manualDraw()">DRAW</div>
            </div>
        </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
